<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <title>Viewer — Watch Desktop</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 32px 24px;
      color: #1a1a1a;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      color: white;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 28px;
      font-weight: 600;
    }

    #info {
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 24px;
      font-size: 14px;
    }

    #roomList {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 32px;
    }

    #roomList button {
      padding: 12px 16px;
      background: white;
      color: #667eea;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    #roomList button:hover {
      background: #667eea;
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    #remoteVideo {
      width: 100%;
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      background-color: #000;
      margin-bottom: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      display: block;
    }

    #turnOnMic {
      padding: 12px 24px;
      background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
    }

    #turnOnMic:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(40, 167, 69, 0.4);
    }

    #turnOnMic:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="container">
    <div style="background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);">
      <h1 style="color: black;">
        <i class="fas fa-broadcast-tower"></i>
        Viewer
      </h1>
      <div id="info" style="color: black;">Select a broadcaster to watch:</div>
      <div id="roomList" style="color: black;">Loading rooms...</div>
      <video id="remoteVideo" autoplay playsinline controls></video>
      <button id="turnOnMic" style="display:none;">Turn on your Mic</button>
    </div>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
