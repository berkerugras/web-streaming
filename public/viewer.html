<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Viewer — Watch Desktop</title>
  <link rel="stylesheet" href="style.css">
  <style>
    #roomList button {
      margin: 5px;
      padding: 8px 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #roomList button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <h1>Viewer</h1>
  <div id="info">Select a broadcaster to watch:</div>
  <div id="roomList">Loading rooms...</div>
  <video id="remoteVideo" autoplay playsinline controls></video>
  <button id="turnOnMic" style="display:none;">Turn on your Mic</button>
  <script src="/socket.io/socket.io.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
