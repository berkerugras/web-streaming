<html>
      <head>
        <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
          min-height: 100vh;
          display: flex;
          justify-content: center;
          align-items: center;
        }
        .container {
          background: white;
          padding: 40px;
          border-radius: 10px;
          box-shadow: 0 10px 40px rgba(0,0,0,0.2);
          width: 100%;
          max-width: 400px;
        }
        h2 {
          color: #333;
          margin-bottom: 30px;
          text-align: center;
        }
        form {
          display: flex;
          flex-direction: column;
          gap: 15px;
        }
        input {
          padding: 12px;
          border: 2px solid #e0e0e0;
          border-radius: 6px;
          font-size: 14px;
          transition: border-color 0.3s;
        }
        input:focus {
          outline: none;
          border-color: #667eea;
        }
        button {
          padding: 12px;
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
          color: white;
          border: none;
          border-radius: 6px;
          font-size: 16px;
          font-weight: 600;
          cursor: pointer;
          transition: transform 0.2s;
        }
        button:hover {
          transform: translateY(-2px);
        }
        .error {
          color: #e74c3c;
          text-align: center;
          font-size: 14px;
          background: #fadbd8;
          padding: 10px;
          border-radius: 6px;
        }
        </style>
      </head>
      <body>
        <div class="container">
        <h2>🔐 Broadcaster Login</h2>
        <form method="POST" action="/broadcaster-login">
          <input type="password" name="password" placeholder="Enter password" required autofocus>
          <button type="submit">Sign In</button>
        </form>
        <div class="error">❌ Wrong password, please try again</div>
        </div>
      </body>
      </html>
    `
