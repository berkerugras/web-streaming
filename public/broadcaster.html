<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Broadcaster — Share Desktop</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }
    
    h1 {
      font-size: 32px;
      margin-bottom: 10px;
      color: #333;
    }
    
    .status-badge {
      display: inline-block;
      background: #f0f0f0;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      margin-bottom: 20px;
      color: #666;
    }
    
    .button-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }
    
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    #startBtn {
      background: #667eea;
      color: white;
    }
    
    #startBtn:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    
    #stopBtn {
      background: #ef4444;
      color: white;
    }
    
    #stopBtn:hover:not(:disabled) {
      background: #dc2626;
    }
    
    #recordBtn, #turnOnMic {
      background: #10b981;
      color: white;
    }
    
    #recordBtn:hover, #turnOnMic:hover {
      background: #059669;
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    #localVideo {
      width: 100%;
      max-width: 600px;
      border-radius: 8px;
      background: #000;
      margin-bottom: 20px;
    }
    
    #viewerContainer {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 20px;
      max-width: 350px;
    }
    
    #viewerContainer strong {
      display: block;
      margin-bottom: 15px;
      color: #333;
      font-size: 16px;
    }
    
    #viewerList {
      list-style: none;
    }
    
    #viewerList li {
      padding: 10px;
      border-bottom: 1px solid #e5e7eb;
      font-size: 14px;
      color: #555;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    #viewerList li:before {
      content: '';
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      display: inline-block;
    }
    
    #viewerList li:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><i class="fas fa-broadcast-tower"></i> Broadcaster</h1>
    <div class="status-badge">Status: <span id="status">Idle</span></div>
    
    <div class="button-group">
      <button id="startBtn"><i class="fas fa-share-screen"></i> Start Sharing</button>
      <button id="stopBtn" disabled><i class="fas fa-stop"></i> Stop Sharing</button>
      <button id="recordBtn"><i class="fas fa-circle"></i> Record</button>
      <button id="turnOnMic"><i class="fas fa-microphone"></i> Enable Mic</button>

    </div>
    
    <video id="localVideo" autoplay playsinline muted></video>
    <video id="localCam" autoplay playsinline muted style="width: 200px; display:none; margin-top:10px; border: 2px solid #ddd; border-radius: 8px;"></video>
    <audio id="viewerAudio" autoplay></audio>
    <div id="viewerCams" style="margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fill,minmax(200px,1fr)); gap: 12px;"></div>
    <div style="margin-bottom: 2rem;">
      <button id="turnOnCam"><i class="fas fa-video"></i> Enable Cam</button>
      <button id="turnOnViewerCam"><i class="fas fa-video"></i> Enable Viewer Cam</button>
    </div>  

    <div id="viewerContainer">
      <strong><i class="fas fa-users"></i> Active Viewers</strong>
      <ul id="viewerList"></ul>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="broadcaster.js"></script>
</body>
</html>
